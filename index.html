  <!-- Theme bootstrap: runs before first paint so there is never a flash of the wrong theme. -->
  <script>
    (function () {
      var d = document.documentElement;
      try {
        var t = JSON.parse(localStorage.getItem('kernel:theme') || '"system"');
        var s = JSON.parse(localStorage.getItem('kernel:textSize') || '"m"');
        if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t);
        d.setAttribute('data-text', s);
      } catch (e) {}
      if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
        d.classList.add('standalone');
      }
    })();
  </script>
